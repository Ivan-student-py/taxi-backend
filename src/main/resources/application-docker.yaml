spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/taxi_db
    username: taxi_user
    password: taxi_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: redis
      port: 6379

  docker:
    compose:
      enabled: false

logging:
  level:
    root: INFO
    com.taxi: INFO
    org.hibernate.SQL: WARN